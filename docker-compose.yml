services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/data:/app/data
      - ./models:/app/models
    environment:
      HF_HOME: /app/models/huggingface
    ports:
      - "8000:8000"

  web:
    build:
      context: ./web
    depends_on:
      - backend
    ports:
      - "5173:80"
